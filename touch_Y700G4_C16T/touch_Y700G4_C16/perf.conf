# ============================================================
# 性能自适应守护 配置文件 perf.conf (v3.0)
# 修改后重启守护生效 (perf_daemon.sh restart 或重启设备)
#
# v1.1 变更:
#   - 新增 LO_C6 回落阈值 (滞回防抖, 必须低于 HI_C6)
#   - 新增温度防抖参数 TEMP_TRIGGER_STREAK / TEMP_RESTORE_STREAK
#   - HI_LOAD 语义改为 loadavg/核数 比值 (原为绝对值, 8核机易失效)
#   - INTERVAL 默认 3 秒 (原1秒导致频率抖动过大)
# ============================================================

# CPU 总负载阈值 (loadavg 1分钟 / 在线核数, 1.0以上视为高负载; 兜底判据)
HI_LOAD=1.0

# 超大核集群负载触发阈值 (频率占比0~4, 超过则切PERF)
HI_C6=2.5

# 超大核集群负载回落阈值 (低于则切回ECO; 必须 < HI_C6, 制造滞回带)
LO_C6=1.5

# 温度保护阈值 (0.001℃, 95000=95℃ 触发降频; v1.2: 92→95, 平板散热冗余大, 减少无谓触发)
TEMP_MAX=95000

# 温度恢复阈值 (降到 85℃ 解除保护; v1.2: 80→85, 缩短保护窗口, 减少振荡循环)
TEMP_RESTORE=85000

# 触发保护所需连续高温采样次数 (防抖; 默认3次 × INTERVAL ≈ 9秒)
TEMP_TRIGGER_STREAK=3

# 解除保护所需连续低温采样次数 (防抖)
TEMP_RESTORE_STREAK=3

# 温度保护档频率 (v1.2: 高于省电档, 保护期间游戏仍可玩, 避免帧率崩断触)
PROTECT_C4=2400000
PROTECT_C6=2000000

# 轮询间隔 (秒, 越大越稳越省电, 越小响应越快)
INTERVAL=3

# 性能档上限 (kHz)
PERF_C6=4320000
PERF_C4=3532800

# 省电档上限 (kHz)
ECO_C6=1300000
ECO_C4=2400000